<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#075647" />
    <title>페이지를 찾을 수 없습니다 | re:form</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #faf8f3;
        color: #19231f;
        font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
        word-break: keep-all;
      }
      main {
        max-width: 800px;
        margin: 15vh auto;
        padding: 32px;
      }
      .logo {
        font-size: 28px;
        font-weight: 800;
        color: #075647;
        text-decoration: none;
      }
      p {
        color: #65706a;
        line-height: 1.9;
      }
      h1 {
        font-size: clamp(28px, 5vw, 44px);
      }
      .btn {
        display: inline-block;
        margin-top: 24px;
        padding: 14px 24px;
        border-radius: 30px;
        background: #075647;
        color: white;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #77c8ac;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <a class="logo" href="/">re:form</a>
      <p>404</p>
      <h1>페이지를 찾을 수 없습니다.</h1>
      <p>주소를 확인하거나 홈에서 다시 둘러보세요.</p>
      <a class="btn" href="/">홈으로 돌아가기</a>
    </main>
  </body>
</html>
